<!DOCTYPE html>
<html lang="zh">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/favicon.svg">
  <title>妙搭</title>
  <script>
    try {
      window.__platform__ = JSON.parse('{{{__platform__}}}');
    } catch (e) {
      // Static hosting (GitHub Pages): `{{{__platform__}}}` is never
      // substituted and this throws. Intentionally leave __platform__
      // undefined -- it is the flag the app uses to detect static hosting and
      // switch to the localStorage-backed offline adapter.
    }
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/client/src/index.tsx"></script>
</body>

</html>
